    .land-auto-badge {

</head> <body>

<table class="custom-table">
    <tr>
        <td class="title-cell">
            <span><span class="star">*</span>工程項目及地點</span>
            <button type="button" class="btn-permit" onclick="openPermitModal()">新增容許使用</button>
        </td>
        <td class="content-cell">
            <div class="select-group">
                縣市：
                <select name="county">
                    <option value="屏東縣" selected>屏東縣</option>
                </select>
                鄉鎮市區：
                <select name="town">
                    <option value="琉球鄉" selected>琉球鄉</option>
                </select>
                村里：
                <select name="village">
                    <option value="中福村" selected>中福村</option>
                </select>
            </div>

            <table class="inner-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">工區</th>
                        <th style="width: 45%;">預計辦理項目及概估數量</th>
                        <th style="width: 15%;">X坐標</th>
                        <th style="width: 15%;">Y坐標</th>
                        <th style="width: 15%;">操作</th>
                    </tr>
                </thead>
                <tbody id="itemList">
                    <tr>
                        <td><input type="text" id="inputZone" placeholder="工區1"></td>
                        <td><input type="text" id="inputItem"></td>
                        <td><input type="text" id="inputX" required placeholder="請輸入X坐標"></td>
                        <td><input type="text" id="inputY" required placeholder="請輸入Y坐標"></td>
                        <td><button type="button" class="btn-add" onclick="addItem()">新增</button></td>
                    </tr>
                    <tr>
                        <td>工區1</td>
                        <td style="text-align: left; padding-left: 12px;">擋土牆 長80m 高6m,欄桿 100m,多功能廣場700m²,步道 30m</td>
                        <td>186433</td>
                        <td>2472420</td>
                        <td><button type="button" class="btn-add" onclick="editRow(this)">編輯</button> <button type="button" class="btn-delete" onclick="deleteRow(this)">刪除</button></td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
</table>

<!-- ===== 模态框 ===== -->
<div class="modal-overlay" id="permitModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>📋 新增容許使用</h2>
            <button class="modal-close" onclick="closePermitModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <div id="modalContent"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closePermitModal()">取消</button>
            <button class="btn-confirm" onclick="confirmPermit()">確認</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  1. 原有功能：新增 / 刪除 項目
    // ============================================================
    let editingRow = null;

    function addItem() {
        const xInput = document.getElementById('inputX');
        const yInput = document.getElementById('inputY');
        const x = xInput?.value.trim() || '';
        const y = yInput?.value.trim() || '';
        if (!x) {
            alert('X坐標為必填，請先輸入X坐標。');
            xInput?.focus();
            return;
        }
        if (!y) {
            alert('Y坐標為必填，請先輸入Y坐標。');
            yInput?.focus();
            return;
        }

        const zoneInput = document.getElementById('inputZone');
        const itemInput = document.getElementById('inputItem');
        const zoneVal = zoneInput.value.trim() || `工區${document.querySelectorAll('#itemList tr').length}`;
        // 預計辦理項目及概估數量統一以半形逗號分隔
        const itemVal = itemInput.value.trim().replace(/[、，]/g, ',').replace(/\s*,\s*/g, ', ');
        const xVal = xInput.value.trim();
        const yVal = yInput.value.trim();

        if (!itemVal) {
            alert('請輸入「預計辦理項目及概估數量」。');
            itemInput.focus();
            return;
        }

        if (editingRow) {
            const cells = editingRow.querySelectorAll('td');
            cells[0].textContent = zoneVal;
            cells[1].textContent = itemVal;
            cells[2].textContent = xVal;
            cells[3].textContent = yVal;
            resetItemForm();
            return;
        }

        const tbody = document.getElementById('itemList');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td>${escapeHtml(zoneVal)}</td>
            <td style="text-align: left; padding-left: 12px;">${escapeHtml(itemVal)}</td>
            <td>${escapeHtml(xVal)}</td>
            <td>${escapeHtml(yVal)}</td>
            <td><button type="button" class="btn-add" onclick="editRow(this)">編輯</button> <button type="button" class="btn-delete" onclick="deleteRow(this)">刪除</button></td>
        `;
        tbody.appendChild(newRow);
        resetItemForm();
    }

    function editRow(btn) {
        const row = btn.closest('tr');
        if (!row || row.querySelector('input[type="text"]')) return;
        const cells = row.querySelectorAll('td');
        if (cells.length < 5) return;
        editingRow = row;
        document.getElementById('inputZone').value = cells[0].textContent.trim();
        document.getElementById('inputItem').value = cells[1].textContent.trim().replace(/[、，]/g, ',');
        document.getElementById('inputX').value = cells[2].textContent.trim();
        document.getElementById('inputY').value = cells[3].textContent.trim();
        const addButton = document.querySelector('#itemList tr:first-child .btn-add');
        if (addButton) {
            addButton.textContent = '儲存修改';
            addButton.style.backgroundColor = '#e5a33d';
        }
        document.getElementById('inputZone').focus();
    }

    function resetItemForm() {
        document.getElementById('inputZone').value = '';
        document.getElementById('inputItem').value = '';
        document.getElementById('inputX').value = '';
        document.getElementById('inputY').value = '';
        editingRow = null;
        const addButton = document.querySelector('#itemList tr:first-child .btn-add');
        if (addButton) {
            addButton.textContent = '新增';
            addButton.style.backgroundColor = '';
        }
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        if (row === editingRow) resetItemForm();
        row.remove();
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ============================================================
    //  2. 類型 ↔ 細目 對應表
    // ============================================================
    const detailMap = {
        // 依使用者提供之分類表圖片為準，保留原始類型與細目名稱
        '安全設施': ['（一）社區道路', '（二）溝渠', '（三）標示解說設施', '（四）水土保持及防災設施'],
        '保育設施': ['生態保育設施'],
        '生活基礎設施': ['（一）步道', '（二）網路及資訊之基礎建設', '（三）自用自來水處理及水資源再利用設施', '（四）衛生設施（含公廁）'],
        '休憩設施': ['（一）自行車道', '（二）簡易平面停車場', '（三）廣場', '（四）環境綠美化及景觀維護', '（五）景觀休閒設施', '（六）運動設施'],
        '其他設施': ['（一）傳統建築', '（二）文物及文化設施', '（三）其他農村再生設施']
    };

    // ============================================================
    //  3. 模态框控制
    // ============================================================
    function openPermitModal() {
        const modal = document.getElementById('permitModal');
        modal.classList.add('active');
        renderPermitContent();
        document.body.style.overflow = 'hidden';
    }

    function closePermitModal() {
        const modal = document.getElementById('permitModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    document.getElementById('permitModal').addEventListener('click', function(e) {
        if (e.target === this) closePermitModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closePermitModal();
    });

    // ============================================================
    //  4. 渲染模态框内容
    // ============================================================
    function renderPermitContent() {
        const container = document.getElementById('modalContent');

        const tbody = document.getElementById('itemList');
        const rows = tbody.querySelectorAll('tr');
        const dataRows = [];
        for (let i = 0; i < rows.length; i++) {
            const tr = rows[i];
            const hasInput = tr.querySelector('input[type="text"]');
            if (hasInput) continue;
            const tds = tr.querySelectorAll('td');
            if (tds.length < 3) continue;

            const zoneName = tds[0].textContent.trim();
            const itemName = tds[1].textContent.trim();
            const xVal = tds[2].textContent.trim();
            const yVal = tds[3].textContent.trim();

            // 同一筆原始資料視為同一個「工區」，
            // 但「預計辦理項目及概估數量」中的多個項目各自成一列。
            const itemParts = itemName
                .replace(/[、，]/g, ',').split(',')
                .map(item => item.trim())
                .filter(item => item);

            dataRows.push({
                zoneName,
                xVal,
                yVal,
                items: itemParts.length ? itemParts : [itemName]
            });
        }

        if (dataRows.length === 0) {
            container.innerHTML = `<div class="empty-msg">⚠️ 目前沒有「預計辦理項目及概估數量」資料，請先新增項目。</div>`;
            return;
        }

        let html = `
            <table class="modal-table">
              <thead>
                <tr>
                  <th style="width:5%;">工區</th>
                  <th style="width:14%;">預計辦理項目及概估數量</th>
                  <th style="width:7%;">類型</th>
                  <th style="width:9%;">細目</th>
                  <th style="width:6%;">X坐標</th>
                  <th style="width:6%;">Y坐標</th>
                  <th style="width:43%;">地段／地號／使用地類別／面積 <span style="font-weight:normal;font-size:12px;">(地籍資料服務)</span></th>
                  <th style="width:10%;">總面積</th>
                </tr>
              </thead>
              <tbody>
          `;

        dataRows.forEach((group, groupIndex) => {
            const zoneNo = group.zoneName || `工區${groupIndex + 1}`;
            const rowSpan = group.items.length;

            group.items.forEach((itemName, itemIndex) => {
                const safeItem = escapeHtml(itemName);
                const safeX = escapeHtml(group.xVal);
                const safeY = escapeHtml(group.yVal);

                const typeOpts = Object.keys(detailMap).map(t =>
                    `<option value="${t}">${t}</option>`
                ).join('');

                const landUseOpts = ['農牧用地', '林業用地', '養殖用地'].map(t =>
                    `<option value="${t}">${t}</option>`
                ).join('');

                const dataIndex = `${groupIndex}-${itemIndex}`;

                html += `
                    <tr data-index="${dataIndex}" data-group-index="${groupIndex}" data-item-index="${itemIndex}" data-itemname="${safeItem}">
                      ${itemIndex === 0 ? `<td class="row-label" rowspan="${rowSpan}">${escapeHtml(zoneNo)}</td>` : ''}
                      <td class="item-name">${safeItem}</td>
                      <td>
                        <select class="sel-type" data-index="${dataIndex}" onchange="updateDetailOptions('${dataIndex}')">
                          ${typeOpts}
                        </select>
                      </td>
                      <td>
                        <select class="sel-detail" data-index="${dataIndex}">
                          <!-- 由 JS 動態填充 -->
                        </select>
                      </td>
                      <td>
                        <input type="text" class="input-x" value="${safeX}" placeholder="X坐標">
                      </td>
                      <td>
                        <input type="text" class="input-y" value="${safeY}" placeholder="Y坐標">
                      </td>
                      <td>
                        <div class="land-service">
                          <div class="land-service-header">
                            <span class="land-service-title">地籍資料服務</span>
                            <span class="land-service-status">● 地籍資料</span>
                          </div>

                          <div class="land-container" data-index="${dataIndex}">
                            <div class="land-group">
                              <div class="land-field">
                              <span class="land-field-label">地段</span>
                              <input type="text" class="section-input" placeholder="由坐標自動帶入">
                            </div>
                            <div class="land-field">
                              <span class="land-field-label">地號</span>
                              <input type="text" class="land-number-input" placeholder="由坐標自動帶入（例：123-4）">
                            </div>
                            <div class="land-field">
                              <span class="land-field-label">使用地類別</span>
                              <select class="land-use-input">
                                <option value="">請選擇</option>
                                <option value="農牧用地">農牧用地</option>
                                <option value="林業用地">林業用地</option>
                                <option value="養殖用地">養殖用地</option>
                              </select>
                            </div>
                            <div class="land-field">
                              <span class="land-field-label">面積</span>
                              <input type="number" class="area-input" min="0" step="0.01" placeholder="㎡" oninput="updateGroupTotalArea(this)">
                            </div>
                            <button type="button" class="btn-remove-land" onclick="removeLandGroup(this)" style="display:none;">×</button>
                            </div>
                          </div>

                          <button type="button" class="btn-add-land" onclick="addLandGroup('${dataIndex}')">＋ 新增地段／地號</button>
                          <div class="land-query-result" id="landQueryResult-${dataIndex}"></div>
                          <div style="margin-top:6px;"><button type="button" class="btn-query-land" onclick="queryCadastralByCoordinate('${dataIndex}')">↗ 依坐標帶入地段／地號／使用地類別／面積</button></div>
                          <div class="land-service-note">可新增多筆地段／地號，每筆可指定使用地類別及面積。</div>
                        </div>
                      </td>
                      ${itemIndex === 0 ? `
                      <td class="group-total-area-cell" rowspan="${rowSpan}">
                        <span class="group-total-area" data-group-index="${groupIndex}">0</span>
                        <span style="font-size:11px;color:#777;">㎡</span>
                      </td>` : ''}
                    </tr>
                `;

                // 第一個項目就是同一工區的第一列；其餘項目只是同工區的子列。
            });
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
        bindAreaChangeEvents();
        refreshSectionOptions(container);

        const rows2 = container.querySelectorAll('tr[data-index]');
        rows2.forEach((tr, idx) => {
            const typeSel = tr.querySelector('.sel-type');
            const detailSel = tr.querySelector('.sel-detail');
            if (typeSel && detailSel) {
                const defaultType = typeSel.value || '安全設施';
                updateDetailOptionsForSelect(detailSel, defaultType);
                if (detailSel.options.length > 0) {
                    detailSel.selectedIndex = 0;
                }
            }
            const landContainer = tr.querySelector('.land-container');
            if (landContainer) {
                const groups = landContainer.querySelectorAll('.land-group');
                if (groups.length === 1) {
                    const btn = groups[0].querySelector('.btn-remove-land');
                    if (btn) btn.style.display = 'none';
                }
            }
        });
        refreshAllGroupTotalAreas();
    }

    // ============================================================
    //  5. 類型 ↔ 細目 連動
    // ============================================================
    function updateDetailOptions(index) {
        const tr = document.querySelector(`.modal-table tr[data-index="${index}"]`);
        if (!tr) return;
        const typeSel = tr.querySelector('.sel-type');
        const detailSel = tr.querySelector('.sel-detail');
        if (!typeSel || !detailSel) return;
        const selectedType = typeSel.value;
        updateDetailOptionsForSelect(detailSel, selectedType);
        if (detailSel.options.length > 0) {
            detailSel.selectedIndex = 0;
        }
    }

    function updateDetailOptionsForSelect(detailSel, typeKey) {
        const details = detailMap[typeKey] || ['其他細目'];
        detailSel.innerHTML = '';
        details.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            detailSel.appendChild(opt);
        });
    }

    // ============================================================
    //  6. 地段/地號 新增 / 刪除（母號、子號）
    // ============================================================

    // ============================================================
    //  6. 地段/地號 新增 / 刪除（母號、子號）
    // ============================================================
    const sectionMap = {
        '屏東縣|琉球鄉|中福村': ['中福段', '大福段', '本福段'],
        '屏東縣|琉球鄉|漁福村': ['漁福段', '大福段'],
        '屏東縣|琉球鄉|南福村': ['南福段', '大福段'],
        '屏東縣|琉球鄉|本福村': ['本福段', '中福段']
    };

    function getSectionOptions() {
        const county = document.querySelector('select[name="county"]')?.value || '';
        const town = document.querySelector('select[name="town"]')?.value || '';
        const village = document.querySelector('select[name="village"]')?.value || '';
        const key = `${county}|${town}|${village}`;
        return sectionMap[key] || ['請由地籍資料服務帶入'];
    }

    function refreshSectionOptions(scope = document) {
        const options = getSectionOptions();
        scope.querySelectorAll('.section-input').forEach(input => {
            // 第一組地段使用文字輸入，新增組則是 select。
            if (input.tagName !== 'SELECT') return;
            const oldValue = input.value;
            input.innerHTML = '<option value="">請選擇地段</option>';
            options.forEach(section => {
                const opt = document.createElement('option');
                opt.value = section;
                opt.textContent = section;
                input.appendChild(opt);
            });
            if (options.includes(oldValue)) input.value = oldValue;
        });
    }

    function bindAreaChangeEvents() {
        ['county', 'town', 'village'].forEach(name => {
            const select = document.querySelector(`select[name="${name}"]`);
            if (select && !select.dataset.sectionBound) {
                select.addEventListener('change', () => refreshSectionOptions(document));
                select.dataset.sectionBound = '1';
            }
        });
    }

    function addLandGroup(index) {
        const container = document.querySelector(`.land-container[data-index="${index}"]`);
        if (!container) return;

        const group = document.createElement('div');
        group.className = 'land-group';
        group.innerHTML = `
            <div class="land-field">
              <span class="land-field-label">地段</span>
              <select class="section-input">
                <option value="">請先選擇</option>
              </select>
            </div>
            <div class="land-field">
              <span class="land-field-label">地號</span>
              <input type="text" class="land-number-input" placeholder="例：123-4">
            </div>
            <div class="land-field">
              <span class="land-field-label">使用地類別</span>
              <select class="land-use-input">
                <option value="">請選擇</option>
                <option value="農牧用地">農牧用地</option>
                <option value="林業用地">林業用地</option>
                <option value="養殖用地">養殖用地</option>
              </select>
            </div>
            <div class="land-field">
              <span class="land-field-label">面積</span>
              <input type="number" class="area-input" min="0" step="0.01" placeholder="㎡" oninput="updateGroupTotalArea(this)">
            </div>
            <button type="button" class="btn-remove-land" onclick="removeLandGroup(this)">×</button>
        `;
        container.appendChild(group);
        refreshSectionOptions(group);

        container.querySelectorAll('.btn-remove-land').forEach(btn => btn.style.display = '');
        const first = container.querySelector('.land-group:first-child .btn-remove-land');
        if (first && container.querySelectorAll('.land-group').length === 1) first.style.display = 'none';

        const area = group.querySelector('.area-input');
        if (area) updateGroupTotalArea(area);
    }

    function removeLandGroup(btn) {
        const group = btn.closest('.land-group');
        const container = group?.closest('.land-container');
        if (!container) return;

        const groups = container.querySelectorAll('.land-group');
        if (groups.length <= 1) {
            alert('至少保留一組地段、地號。');
            return;
        }

        group.remove();

        const remaining = container.querySelectorAll('.land-group');
        if (remaining.length === 1) {
            const delBtn = remaining[0].querySelector('.btn-remove-land');
            if (delBtn) delBtn.style.display = 'none';
        }

        const firstArea = container.querySelector('.area-input');
        if (firstArea) updateGroupTotalArea(firstArea);
    }

    // ============================================================
    //  6-0. 工區總面積自動加總
    //      同一工區內所有「預計辦理項目及概估數量」
    //      的所有地段／地號面積全部加總
    // ============================================================
    function updateGroupTotalArea(areaInput) {
        const currentRow = areaInput.closest('tr[data-group-index]');
        if (!currentRow) return;

        const groupIndex = currentRow.getAttribute('data-group-index');
        let total = 0;

        document.querySelectorAll(
            `.modal-table tr[data-group-index="${groupIndex}"] .area-input`
        ).forEach(input => {
            const value = parseFloat(input.value);
            if (Number.isFinite(value) && value >= 0) {
                total += value;
            }
        });

        const totalInput = document.querySelector(
            `.group-total-area[data-group-index="${groupIndex}"]`
        );

        if (totalInput) {
            totalInput.textContent = Number.isInteger(total)
                ? String(total)
                : total.toFixed(2).replace(/\.?0+$/, '');
        }
    }

    function refreshAllGroupTotalAreas() {
        const groups = new Set();

        document.querySelectorAll('.modal-table tr[data-group-index]').forEach(row => {
            groups.add(row.getAttribute('data-group-index'));
        });

        groups.forEach(groupIndex => {
            const firstArea = document.querySelector(
                `.modal-table tr[data-group-index="${groupIndex}"] .area-input`
            );
            if (firstArea) {
                updateGroupTotalArea(firstArea);
            }
        });
    }

    // ============================================================
    //  6-1. 依座標查詢地籍資料
    // ============================================================
    async function queryCadastralByCoordinate(index) {
        const tr = document.querySelector(`.modal-table tr[data-index="${index}"]`);
        const resultBox = document.getElementById(`landQueryResult-${index}`);
        if (!tr || !resultBox) return;

        const xInput = tr.querySelector('.input-x');
        const yInput = tr.querySelector('.input-y');
        const x = xInput ? xInput.value.trim() : '';
        const y = yInput ? yInput.value.trim() : '';

        if (!x || !y) {
            alert('請先輸入 X、Y 座標。');
            return;
        }

        const xNum = Number(x.replace(/,/g, ''));
        const yNum = Number(y.replace(/,/g, ''));

        if (!Number.isFinite(xNum) || !Number.isFinite(yNum)) {
            alert('X、Y 座標必須為數字。');
            return;
        }

        try {
            /*
             * 正式環境：
             * 將此 URL 改成甲方／地政資料服務實際提供的 API。
             *
             * 預期 API 回傳格式：
             * {
             *   "success": true,
             *   "section": "○○段",
             *   "mainNumber": "123",
             *   "subNumber": "4"
             * }
             */
            const apiUrl = `/api/cadastral/by-coordinate?x=${encodeURIComponent(xNum)}&y=${encodeURIComponent(yNum)}`;

            // =====================================================
            // Demo 模式
            // 若目前尚未有後端 API，先使用座標範例資料測試畫面流程。
            // 正式串接時可將 demoCadastralLookup() 移除，直接使用 fetch。
            // =====================================================
            const data = await demoCadastralLookup(xNum, yNum);

            if (!data || !data.success) {
                throw new Error('查無對應地籍資料');
            }

            const landContainer = tr.querySelector('.land-container');
            const firstGroup = landContainer ? landContainer.querySelector('.land-group') : null;

            if (!firstGroup) throw new Error('找不到地段／地號欄位');

            firstGroup.querySelector('.section-input').value = data.section || '';
            firstGroup.querySelector('.land-number-input').value = `${data.mainNumber || ''}${data.subNumber ? '-' + data.subNumber : ''}`;

            const landUseInput = firstGroup.querySelector('.land-use-input');
            if (landUseInput) landUseInput.value = data.landUse || '';

            const areaInput = firstGroup.querySelector('.area-input');
            if (areaInput) {
                areaInput.value = data.area ?? '';
                updateGroupTotalArea(areaInput);
            }

            resultBox.innerHTML = `
                <strong>✓ 已依座標取得地籍資料</strong><br>
                座標：${escapeHtml(String(x))} ／ ${escapeHtml(String(y))}<br>
                地段：${escapeHtml(data.section || '')}
              　地號：${escapeHtml(`${data.mainNumber || ''}${data.subNumber ? '-' + data.subNumber : ''}`)}<br>
                使用地類別：${escapeHtml(data.landUse || '')}　面積：${escapeHtml(String(data.area ?? ''))} ㎡
                <span class="land-auto-badge">自動帶入</span>
            `;
        } catch (error) {
            resultBox.innerHTML = `
                <span style="color:#a94442;">
                    ⚠️ ${escapeHtml(error.message || '地籍資料查詢失敗')}
                </span>
            `;
        }
    }

    // ============================================================
    // Demo 地籍資料服務
    // ============================================================
    async function demoCadastralLookup(x, y) {
        /*
         * 這裡是前端 Demo。
         * 正式環境請改為：
         *
         * const response = await fetch(apiUrl);
         * if (!response.ok) throw new Error('地籍資料服務連線失敗');
         * return await response.json();
         *
         * 目前提供一組與原 HTML 範例相符的座標，
         * 方便直接展示「輸入座標 → 自動帶入地段／母號／子號」。
         */
        await new Promise(resolve => setTimeout(resolve, 500));

        // Demo 模式：讓所有工區／所有項目的「依坐標帶入」都能使用相同流程。
        // 正式環境請改由地籍 API 依實際 X/Y 回傳對應資料。
        return {
            success: true,
            section: '中福段',
            mainNumber: '123',
            subNumber: '4',
            landUse: '農牧用地',
            area: '120.5'
        };
    }

    // 保留原有函式名稱，避免其他既有程式呼叫時出錯。
    function queryCadastralData(index) {
        const tr = document.querySelector(`.modal-table tr[data-index="${index}"]`);
        const container = document.querySelector(`.land-container[data-index="${index}"]`);
        const resultBox = document.getElementById(`landQueryResult-${index}`);
        if (!tr || !container || !resultBox) return;

        const x = tr.querySelector('.input-x')?.value.trim() || '';
        const y = tr.querySelector('.input-y')?.value.trim() || '';

        if (!x || !y) {
            alert('請先確認 X、Y 座標都有資料。');
            return;
        }

        // Demo：正式環境在此呼叫「座標 → 地籍圖／地號」API。
        // 先依鄉鎮市區／村里縮小地段範圍，再由 X/Y 取得實際地段、母號、子號。
        const sections = getSectionOptions().filter(v => v !== '請由地籍資料服務帶入');
        const groups = container.querySelectorAll('.land-group');
        const targetGroup = groups[0];

        if (targetGroup) {
            const sectionSelect = targetGroup.querySelector('.section-input');
            if (sectionSelect) {
                refreshSectionOptions(targetGroup);
                if (!sectionSelect.value && sections.length > 0) {
                    sectionSelect.value = sections[0];
                }
            }

            // Demo 範例：實際資料應由 API 回傳，不應由前端自行推算地號。
            targetGroup.querySelector('.land-number-input').value = '123-4';
            const landUse = targetGroup.querySelector('.land-use-input');
            if (landUse) landUse.value = '農牧用地';
            const area = targetGroup.querySelector('.area-input');
            if (area) { area.value = '120.5'; updateGroupTotalArea(area); }
        }

        resultBox.innerHTML = '';
        resultBox.classList.remove('active');
    }

    // ============================================================
    //  7. 確認按鈕：收集所有數據（地號合併顯示）
    // ============================================================
    function confirmPermit() {
        const container = document.getElementById('modalContent');
        const rows = container.querySelectorAll('tr[data-index]');

        if (rows.length === 0) {
            alert('沒有資料可儲存。');
            return;
        }

        const result = [];
        let hasError = false;

        rows.forEach((tr) => {
            const index = tr.getAttribute('data-index');
            const itemName = tr.getAttribute('data-itemname') || '';

            const typeSel = tr.querySelector('.sel-type');
            const detailSel = tr.querySelector('.sel-detail');
            const xInput = tr.querySelector('.input-x');
            const yInput = tr.querySelector('.input-y');
            const landUseSel = tr.querySelector('.land-use-input');

            const type = typeSel ? typeSel.value : '';
            const detail = detailSel ? detailSel.value : '';
            const x = xInput ? xInput.value.trim() : '';
            const y = yInput ? yInput.value.trim() : '';
            const landUse = landUseSel ? landUseSel.value : '';

            const landContainer = tr.querySelector('.land-container');
            const landGroups = [];
            if (landContainer) {
                const groups = landContainer.querySelectorAll('.land-group');
                groups.forEach(group => {
                    const section = group.querySelector('.section-input')?.value.trim() || '';
                    const landNumber = group.querySelector('.land-number-input')?.value.trim() || '';
                    const [mainNumber = '', ...subParts] = landNumber.split('-');
                    const subNumber = subParts.join('-');
                    const landUse = group.querySelector('.land-use-input')?.value.trim() || '';
                    const area = group.querySelector('.area-input')?.value.trim() || '';
                    if (section || landNumber || landUse || area) {
                        landGroups.push({ section, landNumber, mainNumber, subNumber, landUse, area });
                    }
                });
            }

            if (!type) {
                alert(`工區 ${parseInt(index.split('-')[0]) + 1} 請選擇「類型」。`);
                hasError = true;
                return;
            }
            if (!detail) {
                alert(`工區 ${parseInt(index.split('-')[0]) + 1} 請選擇「細目」。`);
                hasError = true;
                return;
            }
            if (landGroups.length === 0) {
                alert(`工區 ${parseInt(index.split('-')[0]) + 1} 請至少輸入一組「地段 / 地號」。`);
                hasError = true;
                return;
            }

            result.push({
                工區編號: `工區${parseInt(index.split('-')[0]) + 1}`,
                預計辦理項目: itemName,
                類型: type,
                細目: detail,
                X坐標: x,
                Y坐標: y,
                地段地號: landGroups,  // 每組包含 section, landNumber（並保留母號、子號拆分欄位供既有資料相容）
                使用地類別: landGroups.map(g => g.landUse).filter(Boolean),
                總面積: landGroups.reduce((sum, g) => {
                    const a = parseFloat(g.area);
                    return sum + (Number.isFinite(a) && a >= 0 ? a : 0);
                }, 0)
            });
        });

        if (hasError) return;

        console.log('===== 容許使用資料 =====');
        console.log(JSON.stringify(result, null, 2));
        console.log('=========================');

        alert(`✅ 已成功收集 ${result.length} 筆容許使用資料！\n請查看瀏覽器主控台 (F12) 查看完整 JSON。`);
    }

    console.log('✅ 系統已載入，點擊「新增容許使用」按鈕試試！');
</script>
