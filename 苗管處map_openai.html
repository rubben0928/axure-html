<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>農田水利署工程AI地圖助手</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

html,body{
    height:100%;
    margin:0;
    font-family:"Microsoft JhengHei",sans-serif;
}

#map{
    width:100%;
    height:100%;
}

#chatPanel{

    position:absolute;

    top:20px;
    left:20px;

    width:420px;
    height:600px;

    background:#fff;

    z-index:9999;

    border-radius:12px;

    box-shadow:0 0 20px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;

}

#header{

    background:#1976d2;
    color:white;

    padding:15px;

    border-radius:12px 12px 0 0;

    font-size:20px;
    font-weight:bold;

}

#messages{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#f5f5f5;
}

.message{

    margin-bottom:10px;
    padding:10px;
    border-radius:10px;

    max-width:85%;
}

.user{

    background:#d6ebff;

    margin-left:auto;
}

.ai{

    background:white;
    border:1px solid #ddd;
}

#inputArea{

    display:flex;

    border-top:1px solid #ddd;
}

#question{

    flex:1;

    border:none;

    padding:12px;

    font-size:15px;
}

#question:focus{
    outline:none;
}

button{

    width:90px;

    border:none;

    background:#1976d2;

    color:white;

    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.example{

    font-size:12px;

    color:#666;

    padding:10px;
    border-top:1px solid #eee;
}

</style>

</head>
<body>

<div id="chatPanel">

    <div id="header">
        農田水利署工程AI助手
    </div>

    <div id="messages"></div>

    <div id="inputArea">
        <input
            id="question"
            placeholder="請輸入問題..."
        >
        <button onclick="askAI()">
            查詢
        </button>
    </div>

    <div class="example">

        範例：<br>

        • 落後工程在哪裡？<br>
        • 竹南鎮有哪些工程？<br>
        • 公館鄉落後工程有哪些？<br>
        • 大展營造有哪些工程？<br>
        • 預算超過2000萬的工程在哪裡？

    </div>

</div>

<div id="map"></div>

<script>

//==================================
// 地圖初始化
//==================================

const map = L.map('map')
.setView([24.55,120.82],10);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
).addTo(map);


//==================================
// 模擬工程資料
//==================================

const projects = [

{
id:1,
name:"竹南排水改善工程",
township:"竹南鎮",
contractor:"大展營造",
budget:32500000,
status:"落後",
lat:24.691,
lng:120.875
},

{
id:2,
name:"公館灌區改善工程",
township:"公館鄉",
contractor:"中興營造",
budget:25800000,
status:"落後",
lat:24.501,
lng:120.827
},

{
id:3,
name:"後龍圳改善工程",
township:"後龍鎮",
contractor:"大展營造",
budget:8560000,
status:"符合",
lat:24.616,
lng:120.789
},

{
id:4,
name:"苑裡排水改善工程",
township:"苑裡鎮",
contractor:"永昌營造",
budget:22600000,
status:"超前",
lat:24.420,
lng:120.651
},

{
id:5,
name:"卓蘭圳路改善工程",
township:"卓蘭鎮",
contractor:"永昌營造",
budget:11250000,
status:"符合",
lat:24.325,
lng:120.823
},

{
id:6,
name:"通霄灌溉改善工程",
township:"通霄鎮",
contractor:"中興營造",
budget:15800000,
status:"落後",
lat:24.487,
lng:120.676
},

{
id:7,
name:"銅鑼農路改善工程",
township:"銅鑼鄉",
contractor:"大展營造",
budget:9800000,
status:"超前",
lat:24.487,
lng:120.786
}

];


//==================================
// Marker管理
//==================================

let markers=[];

function clearMarkers(){

    markers.forEach(m=>map.removeLayer(m));

    markers=[];
}

function renderProjects(data){

    clearMarkers();

    if(data.length===0){

        alert("查無資料");

        return;
    }

    let bounds=[];

    data.forEach(p=>{

        let marker=L.marker([
            p.lat,
            p.lng
        ]).addTo(map);

        marker.bindPopup(`
            <b>${p.name}</b><br>
            鄉鎮：${p.township}<br>
            廠商：${p.contractor}<br>
            預算：${p.budget.toLocaleString()} 元<br>
            進度：${p.status}
        `);

        markers.push(marker);

        bounds.push([
            p.lat,
            p.lng
        ]);

    });

    map.fitBounds(bounds,{
        padding:[50,50]
    });
}

renderProjects(projects);


//==================================
// 對話訊息
//==================================

function addMessage(text,type){

    const div=document.createElement("div");

    div.className=
        "message "+type;

    div.innerHTML=text;

    document
        .getElementById("messages")
        .appendChild(div);

    document
        .getElementById("messages")
        .scrollTop=
        document
        .getElementById("messages")
        .scrollHeight;
}


//==================================
// AI查詢
//==================================

function askAI(){

    const q =
    document
    .getElementById("question")
    .value
    .trim();

    if(q==="") return;

    addMessage(q,"user");

    let result=[...projects];

    const townships=[

        "竹南鎮",
        "後龍鎮",
        "苑裡鎮",
        "公館鄉",
        "卓蘭鎮",
        "通霄鎮",
        "銅鑼鄉"

    ];

    const contractors=[

        "大展營造",
        "永昌營造",
        "中興營造"

    ];


    // 鄉鎮

    let township=
    townships.find(
        t=>q.includes(t)
    );

    if(township){

        result=
        result.filter(
            x=>x.township===township
        );
    }

    // 廠商

    let contractor=
    contractors.find(
        c=>q.includes(c)
    );

    if(contractor){

        result=
        result.filter(
            x=>x.contractor===contractor
        );
    }

    // 落後

    if(q.includes("落後")){

        result=
        result.filter(
            x=>x.status==="落後"
        );
    }

    // 超前

    if(q.includes("超前")){

        result=
        result.filter(
            x=>x.status==="超前"
        );
    }

    // 符合

    if(q.includes("符合")){

        result=
        result.filter(
            x=>x.status==="符合"
        );
    }

    // 預算

    if(
       q.includes("1000萬") ||
       q.includes("一千萬")
    ){

        result=
        result.filter(
            x=>x.budget>10000000
        );
    }

    if(
       q.includes("2000萬") ||
       q.includes("二千萬")
    ){

        result=
        result.filter(
            x=>x.budget>20000000
        );
    }

    renderProjects(result);

    let reply="";

    if(result.length===0){

        reply="查無符合條件之工程。";

    }else{

        reply=`
        找到 <b>${result.length}</b> 件工程<br><br>
        ${result.map(x=>
            "• "+x.name
        ).join("<br>")}
        `;
    }

    addMessage(reply,"ai");

    document
    .getElementById("question")
    .value="";
}


// Enter送出

document
.getElementById("question")
.addEventListener(
"keypress",
function(e){

    if(e.key==="Enter"){

        askAI();

    }

});


// 歡迎訊息

addMessage(
`
您好，我可以協助查詢工程分布。

例如：

• 落後工程在哪裡？

• 竹南鎮有哪些工程？

• 大展營造有哪些工程？

• 公館鄉落後工程有哪些？

• 預算超過2000萬的工程在哪裡？
`,
"ai"
);

</script>

</body>
</html>
