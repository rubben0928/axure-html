<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程資料編修 - 容許使用</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 基礎樣式 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
        }
        body {
            background-color: #fff;
            padding: 20px;
        }
        .header-title {
            display: flex;
            align-items: center;
            font-size: 20px;
            color: #555;
            font-weight: normal;
            margin-bottom: 8px;
        }
        .header-title i {
            font-size: 22px;
            margin-right: 8px;
            color: #4a4a4a;
        }
        .color-bar {
            display: flex;
            height: 4px;
            width: 100%;
            margin-bottom: 20px;
        }
        .color-bar .bar-1 { background-color: #b5e28c; flex: 1.2; }
        .color-bar .bar-2 { background-color: #fff3a3; flex: 1; }
        .color-bar .bar-3 { background-color: #fca378; flex: 1; }
        .color-bar .bar-4 { background-color: #f092a1; flex: 1; }
        .color-bar .bar-5 { background-color: #d1b3e8; flex: 1; }

        /* ===== 頁籤選單 ===== */
        .tab-container {
            background-color: #3b82c6;
            display: flex;
            align-items: flex-end;
            padding-left: 10px;
            overflow-x: auto;
            flex-wrap: nowrap;
        }
        .tab-item {
            color: #ffffff;
            padding: 12px 20px;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: background 0.15s;
            user-select: none;
        }
        .tab-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .tab-item.active {
            background-color: #ffffff;
            color: #333333;
            border-top: 3px solid #9c27b0;
            font-weight: bold;
        }

        .project-banner {
            background-color: #d8edd8;
            border-top: 1px solid #b2d8b2;
            padding: 15px 20px;
            font-size: 16px;
            color: #2b572b;
        }
        .project-banner .project-code {
            color: #3b82c6;
            margin-left: 4px;
        }

        /* ===== 主要內容區 ===== */
        .main-content {
            margin-top: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fafafa;
            padding: 0;
            overflow: hidden;
        }

        /* ===== 子頁籤 (階段) ===== */
        .sub-tab-container {
            display: flex;
            background-color: #eef3f7;
            border-bottom: 2px solid #c0d0df;
            padding: 0 12px;
            gap: 4px;
            flex-wrap: wrap;
        }
        .sub-tab-item {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #2c5a7a;
            cursor: pointer;
            border: none;
            background: transparent;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            user-select: none;
        }
        .sub-tab-item:hover {
            background: rgba(59, 130, 198, 0.08);
        }
        .sub-tab-item.active {
            color: #1a3b52;
            border-bottom-color: #3b82c6;
            background: #ffffff;
            border-radius: 6px 6px 0 0;
        }
        .sub-tab-item .badge {
            display: inline-block;
            background: #3b82c6;
            color: #fff;
            font-size: 11px;
            border-radius: 10px;
            padding: 0 8px;
            margin-left: 6px;
            line-height: 18px;
            vertical-align: middle;
        }
        .sub-tab-item .badge.readonly {
            background: #888;
        }

        /* ===== 子頁籤內容 ===== */
        .sub-content {
            padding: 16px 20px 20px 20px;
            background: #ffffff;
            overflow-x: auto;
        }
        .sub-panel {
            display: none;
        }
        .sub-panel.active {
            display: block;
        }

        /* ===== 容許使用階段表格：完全比照「新增容許使用」畫面 ===== */
        .permit-table-wrap { overflow-x: auto; margin-top: 4px; }
        .permit-table, .modal-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1250px; }
        .permit-table th, .modal-table th { background-color:#5bb27a; color:#0b1f31; padding:8px 6px; text-align:center; font-weight:bold; border:1px solid #4a9a66; white-space:nowrap; position:sticky; top:0; z-index:2; }
        .permit-table td, .modal-table td { padding:6px 4px; border:1px solid #ccc; vertical-align:middle; background:#fafafa; }
        .permit-table .row-label, .modal-table .row-label { font-weight:bold; text-align:center; background:#eef6f0; white-space:nowrap; }
        .permit-table select, .permit-table input[type=text], .permit-table input[type=number], .modal-table select, .modal-table input[type=text], .modal-table input[type=number] { width:100%; padding:4px; border:1px solid #aaa; border-radius:3px; background:#fff; font-size:13px; box-sizing:border-box; min-height:30px; }
        .permit-table select:disabled, .permit-table input:disabled, .permit-table input[readonly], .modal-table select:disabled, .modal-table input:disabled, .modal-table input[readonly] { background:#f0f0f0; color:#555; cursor:default; border-color:#ddd; }
        .permit-table .item-name { text-align:left; padding-left:8px; font-size:13px; line-height:1.5; min-width:120px; word-break:break-word; }
        .land-service { border:1px solid #c8d6e5; border-radius:5px; background:#f7fafc; padding:7px; }
        .land-service-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
        .land-service-title { color:#245b7a; font-size:12px; font-weight:bold; white-space:nowrap; }
        .land-service-status { color:#3f7f59; font-size:11px; white-space:nowrap; }
        .land-container { display:flex; flex-direction:column; gap:5px; align-items:stretch; }
        .land-group { display:grid; grid-template-columns:minmax(100px,1.05fr) minmax(110px,1fr) minmax(130px,1.2fr) minmax(90px,.8fr) 24px; align-items:stretch; gap:5px; padding:6px; background:#fff; border:1px solid #d7e0e8; border-radius:3px; }
        .land-field { display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:3px; min-width:0; }
        .land-field-label { display:block; color:#65717c; font-size:11px; line-height:1.25; white-space:normal; overflow-wrap:anywhere; }
        .land-group input[type=text], .land-group select.land-use-input, .land-group input.area-input { display:block; width:100%; min-width:0; height:30px; padding:3px 5px; border:1px solid #aebdca; border-radius:3px; background:#fff; box-sizing:border-box; font-size:12px; }
        .land-group input.area-input { text-align:right; }
        .land-separator { text-align:center; color:#697781; font-weight:bold; font-size:12px; }
        .land-group .btn-remove-land { background:#e88686; color:#fff; border:1px solid #d46c6c; border-radius:3px; width:22px; height:22px; font-size:14px; line-height:1; cursor:pointer; padding:0; text-align:center; }
        .btn-add-land, .btn-land-query, .btn-coordinate-query, .btn-query-land { color:#fff; border-radius:3px; padding:4px 9px; font-size:11px; cursor:pointer; margin-top:5px; white-space:nowrap; }
        .btn-add-land { background:#539fe5; border:1px solid #3c82c4; }
        .btn-land-query { background:#5bb27a; border:1px solid #4a9a66; margin-left:4px; }
        .btn-coordinate-query, .btn-query-land { background:#539fe5; border:1px solid #3c82c4; }
        .land-query-result { display:none; margin-top:6px; padding:5px 7px; background:#edf7f0; border-left:3px solid #5bb27a; color:#41604c; font-size:11px; line-height:1.5; }
        .land-query-result.active { display:block; }
        .land-service-note { margin-top:5px; color:#7a858e; font-size:10px; line-height:1.4; }
        .group-total-area { display:inline-block; min-width:70px; text-align:right; font-weight:bold; color:#245b7a; font-size:14px; }
        .readonly-land-group { display:grid; grid-template-columns:minmax(85px,1.05fr) minmax(100px,1fr) minmax(110px,1.2fr) minmax(70px,.8fr); gap:3px; align-items:center; padding:4px; background:#fff; border:1px solid #d7e0e8; border-radius:3px; }
        .readonly-value { min-height:27px; padding:5px 4px; color:#444; font-size:12px; background:#fff; border:0; }
        .readonly-note { margin-top:5px; color:#7a858e; font-size:10px; line-height:1.4; }
        @media (max-width:768px){ .permit-table{font-size:12px;min-width:1250px}.permit-table th,.permit-table td{padding:4px 3px}.land-group{grid-template-columns:minmax(90px,1fr) minmax(95px,1fr) minmax(115px,1.1fr) minmax(80px,.8fr) 24px}.readonly-land-group{grid-template-columns:minmax(90px,1fr) minmax(95px,1fr) minmax(115px,1.1fr) minmax(80px,.8fr)}.sub-content{padding:12px 10px;} }

        /* ===== 操作按鈕 ===== */
        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .action-bar .hint {
            font-size: 13px;
            color: #666;
            margin-left: 4px;
        }
        .btn-add-row {
            background-color: #539fe5;
            color: #fff;
            border: 1px solid #3c82c4;
            border-radius: 4px;
            padding: 6px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-add-row:hover {
            background-color: #438cd2;
        }
        .btn-add-row:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-del-row {
            background-color: #e88686;
            color: #fff;
            border: 1px solid #d46c6c;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-del-row:hover {
            background-color: #d67070;
        }
        .btn-del-row:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-save-stage {
            background-color: #5bb27a;
            color: #fff;
            border: 1px solid #4a9a66;
            border-radius: 4px;
            padding: 6px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-save-stage:hover {
            background-color: #4a9a66;
        }
        .btn-save-stage:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 空狀態 ===== */
        .empty-msg {
            text-align: center;
            color: #888;
            font-size: 15px;
            padding: 30px 0;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .tab-item { padding: 10px 14px; font-size: 14px; }
            .sub-tab-item { padding: 8px 14px; font-size: 13px; }
            .permit-table { font-size: 12px; min-width: 780px; }
            .permit-table th, .permit-table td, .modal-table td { padding: 4px 3px; }
            .sub-content { padding: 12px 10px; }
        }
        @media (max-width: 480px) {
            .permit-table { font-size: 11px; min-width: 680px; }
            .permit-table th, .permit-table td, .modal-table td { padding: 3px 2px; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .action-bar .hint { margin-left: 0; }
        }

        .sub-content::-webkit-scrollbar { width: 6px; height: 6px; }
        .sub-content::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 3px; }
        .sub-content::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }
        .sub-content::-webkit-scrollbar-thumb:hover { background: #999; }
    
        .btn-add-item{display:block;margin:8px auto 0;padding:4px 8px;border:1px solid #4b8b68;border-radius:4px;background:#f4fbf6;color:#28734d;font-size:12px;cursor:pointer;white-space:nowrap;}
        .btn-add-item:hover{background:#e5f5eb;}
        .btn-delete-item,.btn-delete-zone{display:inline-block;margin:6px 2px 0;padding:3px 7px;border:1px solid #d66;border-radius:4px;background:#fff5f5;color:#b42323;font-size:11px;cursor:pointer;white-space:nowrap;}
        .btn-delete-item:hover,.btn-delete-zone:hover{background:#ffe5e5;}
        .item-actions{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:5px;}
</style>
</head>
<body>

    <!-- ===== 標題 ===== -->
    <div class="header-title">
        <i class="fa-solid fa-clipboard-list"></i>
        <span>工程資料編修</span>
    </div>
    <div class="color-bar">
        <div class="bar-1"></div>
        <div class="bar-2"></div>
        <div class="bar-3"></div>
        <div class="bar-4"></div>
        <div class="bar-5"></div>
    </div>

    <!-- ===== 主頁籤 ===== -->
    <div class="tab-container" id="mainTabs">
        <span class="tab-item">基本資料</span>
        <span class="tab-item">預定排程</span>
        <span class="tab-item">執行狀況</span>
        <span class="tab-item">預算額度</span>
        <span class="tab-item">每月進度</span>
        <span class="tab-item">結案資料</span>
        <span class="tab-item">照片上傳</span>
        <span class="tab-item">施工歷程</span>
        <span class="tab-item active" id="tabPermit">容許使用</span>
    </div>

    <!-- ===== 工程名稱 ===== -->
    <div class="project-banner">
        茅埔坑溪(埔鹽林段)右側護岸整治二期工程 <span class="project-code">(115-ADE-06-2-018)</span>
    </div>

    <!-- ===== 主內容：容許使用 ===== -->
    <div class="main-content" id="permitMain">
        <!-- 子頁籤 -->
        <div class="sub-tab-container" id="subTabs">
            <button class="sub-tab-item active" data-stage="kankan">
                <i class="fa-regular fa-eye"></i> 會勘階段
                <span class="badge readonly">檢視</span>
            </button>
            <button class="sub-tab-item" data-stage="heding">
                <i class="fa-regular fa-pen-to-square"></i> 核定階段
                <span class="badge" style="background:#5bb27a;">編輯</span>
            </button>
            <button class="sub-tab-item" data-stage="biangeng">
                <i class="fa-solid fa-arrows-rotate"></i> 變更階段
                <span class="badge" style="background:#5bb27a;">編輯</span>
            </button>
            <button class="sub-tab-item" data-stage="jiean">
                <i class="fa-regular fa-file-lines"></i> 結案階段
                <span class="badge" style="background:#5bb27a;">編輯</span>
            </button>
        </div>

        <!-- 子內容 -->
        <div class="sub-content" id="subContent">
            <!-- 會勘階段 (只讀) -->
            <div class="sub-panel active" id="panelKankan">
                <div class="action-bar">
                    <span style="color:#555; font-weight:bold;"><i class="fa-solid fa-lock"></i> 會勘階段 · 僅供檢視</span>
                    <span class="hint">此階段資料為唯讀，不可新增或修改</span>
                </div>
                <div class="permit-table-wrap" id="kankanWrap"></div>
            </div>

            <!-- 核定階段 (可編輯) -->
            <div class="sub-panel" id="panelHeding">
                <div class="action-bar">
                    <span style="color:#555; font-weight:bold;"><i class="fa-regular fa-pen-to-square"></i> 核定階段 · 可編輯</span>
                    <button class="btn-add-row" id="btnAddHeding">＋ 新增工區</button>
                    <button class="btn-save-stage" id="btnSaveHeding">💾 儲存核定資料</button>
                    <span class="hint" id="hedingStatus" style="color:#888;"></span>
                </div>
                <div class="permit-table-wrap" id="hedingWrap"></div>
            </div>

            <!-- 變更階段 -->
            <div class="sub-panel" id="panelBiangeng">
                <div class="action-bar">
                    <label class="change-toggle" style="font-weight:bold;color:#555;display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="hasBiangeng">
                        <i class="fa-solid fa-arrows-rotate"></i> 是否有變更
                    </label>
                    <span class="hint" id="biangengHint" style="color:#888;">預設為「無變更」</span>
                </div>
                <div id="biangengContent">
                    <div class="action-bar" style="border-top:0;margin-top:0;">
                        <span style="color:#555;font-weight:bold;"><i class="fa-solid fa-arrows-rotate"></i> 變更階段 · 可編輯</span>
                        <button class="btn-add-row" id="btnAddBiangeng">＋ 新增工區</button>
                        <button class="btn-save-stage" id="btnSaveBiangeng">💾 儲存變更資料</button>
                        <span class="hint" id="biangengStatus" style="color:#888;"></span>
                    </div>
                    <div class="permit-table-wrap" id="biangengWrap"></div>
                </div>
            </div>

            <!-- 結案階段 (可編輯) -->
            <div class="sub-panel" id="panelJiean">
                <div class="action-bar">
                    <span style="color:#555; font-weight:bold;"><i class="fa-regular fa-file-lines"></i> 結案階段 · 可編輯</span>
                    <button class="btn-add-row" id="btnAddJiean">＋ 新增工區</button>
                    <button class="btn-save-stage" id="btnSaveJiean">💾 儲存結案資料</button>
                    <span class="hint" id="jieanStatus" style="color:#888;"></span>
                </div>
                <div class="permit-table-wrap" id="jieanWrap"></div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  1. 資料定義
        // ================================================================
        const detailMap = {
            '安全設施': ['警政及消防設施', '社區防災避難設施', '防汛防蓄水設施', '夜照明及安全防護欄杆'],
            '保育設施': ['生態保育設施', '水土保持設施', '環境綠化設施', '動植物保護設施'],
            '生活基礎設施': ['供水設施', '供電設施', '排水設施', '道路設施', '通訊設施'],
            '休憩設施': ['涼亭設施', '座椅設施', '步道設施', '觀景平台', '遊樂設施', '廣場設施'],
            '其他設施': ['其他相關設施']
        };
        const landUseOptions = ['農牧用地', '林業用地', '養殖用地', '建築用地', '交通用地', '水利用地', '其他'];

        // 每個階段都以「工區 → 多個項目 → 每個項目自己的地籍資料」保存，
        // 因此項目以「、」拆開後，不會再共用或覆蓋彼此的地段／地號。
        let dataKankan = [
            {id:1, zoneName:'工區1', items:[
                {itemName:'擋土牆 長80m 高6m', type:'安全設施', detail:'防汛防蓄水設施', x:'186433', y:'2472420', landGroups:[{section:'大興段',mainNumber:'001',subNumber:'2',landUse:'農牧用地',area:'120.5'}]},
                {itemName:'欄桿 100m', type:'安全設施', detail:'夜照明及安全防護欄杆', x:'186433', y:'2472420', landGroups:[{section:'大興段',mainNumber:'001',subNumber:'2',landUse:'農牧用地',area:'0'}]},
                {itemName:'多功能廣場700m²', type:'休憩設施', detail:'廣場設施', x:'186433', y:'2472420', landGroups:[{section:'大興段',mainNumber:'003',subNumber:'1',landUse:'建築用地',area:'80'},{section:'大興段',mainNumber:'003',subNumber:'2',landUse:'建築用地',area:'40.5'}]},
                {itemName:'步道 30m', type:'休憩設施', detail:'步道設施', x:'186433', y:'2472420', landGroups:[{section:'大興段',mainNumber:'005',subNumber:'',landUse:'交通用地',area:'60'}]}
            ]}
        ];
        // 核定階段預設帶入會勘階段；變更階段預設帶入核定階段；結案階段依變更階段是否有資料決定來源。
        const cloneStageData = data => JSON.parse(JSON.stringify(data || []));
        let dataHeding = cloneStageData(dataKankan);
        let dataBiangeng = cloneStageData(dataHeding);
        let dataJiean = cloneStageData(dataBiangeng);
        let nextIdKankan=2, nextIdHeding=2, nextIdBiangeng=2, nextIdJiean=2;
        let currentStage='kankan';

        // 紀錄各階段是否已經建立過預設資料，避免使用者清空後又被自動覆蓋。
        let stageInitialized = { kankan:true, heding:true, biangeng:true, jiean:true };
        // 變更階段是否有變更；預設不勾選。勾選時才顯示變更內容，取消勾選時不顯示任何變更內容，且結案改回使用核定資料。
        let hasBiangeng = false;

        function escapeHtml(str){
            return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }
        function getStageData(stage){return stage==='kankan'?dataKankan:stage==='heding'?dataHeding:stage==='biangeng'?dataBiangeng:stage==='jiean'?dataJiean:[];}
        function setStageData(stage,d){if(stage==='kankan')dataKankan=d;else if(stage==='heding')dataHeding=d;else if(stage==='biangeng')dataBiangeng=d;else if(stage==='jiean')dataJiean=d;}
        function getNextId(stage){if(stage==='kankan')return nextIdKankan++;if(stage==='heding')return nextIdHeding++;if(stage==='biangeng')return nextIdBiangeng++;if(stage==='jiean')return nextIdJiean++;return 1;}
        function stageLabel(stage){return {kankan:'會勘',heding:'核定',biangeng:'變更',jiean:'結案'}[stage]||stage;}
        function ensureStageDefault(stage){
            if(stage==='heding' && !stageInitialized.heding){ dataHeding=cloneStageData(dataKankan); stageInitialized.heding=true; }
            if(stage==='biangeng' && hasBiangeng && !stageInitialized.biangeng){ dataBiangeng=cloneStageData(dataHeding); stageInitialized.biangeng=true; }
            if(stage==='jiean' && !stageInitialized.jiean){
                dataJiean=cloneStageData(hasBiangeng && dataBiangeng.length ? dataBiangeng : dataHeding);
                stageInitialized.jiean=true;
            }
        }
        function updateBiangengVisibility(){
            const content=document.getElementById('biangengContent');
            const hint=document.getElementById('biangengHint');
            if(content) content.style.display=hasBiangeng?'block':'none';
            if(hint) hint.textContent=hasBiangeng?'已勾選「有變更」，顯示變更內容':'未勾選「有變更」，不顯示變更內容';
            if(!hasBiangeng){
                dataBiangeng=[];
                dataJiean=cloneStageData(dataHeding);
                stageInitialized.jiean=true;
            }else if(dataBiangeng.length===0){
                dataBiangeng=cloneStageData(dataHeding);
                stageInitialized.biangeng=true;
            }
            updateStatusMsg('biangeng');
            updateStatusMsg('jiean');
        }

        function isReadonly(stage){return stage==='kankan';}
        function getZone(stage,id){return getStageData(stage).find(z=>z.id===id);}
        function getItem(stage,id,itemIndex){return getZone(stage,id)?.items?.[itemIndex];}
        function formatArea(n){return Number.isInteger(n)?String(n):n.toFixed(2).replace(/\.?0+$/,'');}
        function calcZoneTotal(zone){return (zone.items||[]).reduce((sum,it)=>(it.landGroups||[]).reduce((s,g)=>s+(Number.isFinite(parseFloat(g.area))?parseFloat(g.area):0),sum),0);}

        function populateDetails(sel,typeKey,selected){
            if(!sel)return;
            const list=detailMap[typeKey]||['其他細目'];
            sel.innerHTML=list.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
            if(selected && list.includes(selected)) sel.value=selected;
        }

        function landGroupsHtml(stage,zoneId,itemIndex,item,readonly){
            const groups=(item.landGroups&&item.landGroups.length)?item.landGroups:[{section:'',mainNumber:'',subNumber:'',landUse:'',area:''}];
            return groups.map((g,gi)=>{
                if(readonly){
                    return `<div class="readonly-land-group">
                        <div class="readonly-value">${escapeHtml(g.section)}</div><div class="readonly-value">${escapeHtml(g.mainNumber ? g.mainNumber + (g.subNumber ? '-' + g.subNumber : '') : (g.subNumber || ''))}</div><div class="readonly-value">${escapeHtml(g.landUse)}</div><div class="readonly-value" style="text-align:right;">${escapeHtml(g.area)}</div>
                    </div>`;

                return `<div class="land-group">

                    <div class="land-field"><span class="land-field-label">地號</span><input type="text" class="land-number-input" value="${escapeHtml(g.mainNumber ? g.mainNumber + (g.subNumber ? '-' + g.subNumber : '') : (g.subNumber || ''))}" placeholder="例：123-4"></div>

                    <div class="land-field"><span class="land-field-label">面積</span><input type="number" class="area-input" min="0" step="0.01" value="${escapeHtml(g.area)}" placeholder="㎡"></div>
                    <button type="button" class="btn-remove-land" onclick="removeStageLandGroup(this)" ${groups.length===1&&gi===0?'style="display:none;"':''}>×</button>
                </div>`;
            }).join('');
        }

        function renderTable(stage){
            const data=getStageData(stage), readonly=isReadonly(stage), wrap=document.getElementById(stage+'Wrap');
            if(!wrap)return;
            if(!data.length){wrap.innerHTML='<div class="empty-msg">📭 此階段尚無資料，請點選「新增工區」添加。</div>';return;}
            let html=`<table class="modal-table permit-table"><thead><tr>
                <th style="width:6%;">工區</th><th style="width:17%;">預計辦理項目及概估數量</th><th style="width:9%;">類型</th><th style="width:11%;">細目</th><th style="width:7%;">X坐標</th><th style="width:7%;">Y坐標</th><th style="width:33%;">地段／地號／使用地類別／面積 <span style="font-weight:normal;font-size:12px;">(地籍資料服務)</span></th><th style="width:10%;">總面積</th>
            </tr></thead><tbody>`;
            data.forEach((zone,zi)=>{
                const items=zone.items&&zone.items.length?zone.items:[{itemName:'',type:'安全設施',detail:'',x:'',y:'',landGroups:[{section:'',mainNumber:'',subNumber:'',landUse:'',area:''}]}];
                const rowSpan=items.length,total=calcZoneTotal(zone);
                items.forEach((item,ii)=>{
                    const dataIndex=`${zone.id}-${ii}`;
                    const typeOpts=Object.keys(detailMap).map(t=>`<option value="${escapeHtml(t)}" ${item.type===t?'selected':''}>${escapeHtml(t)}</option>`).join('');
                    html+=`<tr data-stage="${stage}" data-id="${zone.id}" data-item-index="${ii}" data-index="${dataIndex}">
                        ${ii===0?`<td class="row-label" rowspan="${rowSpan}">${(!readonly && zone.isNewZone)?`<label style="display:block;font-size:11px;color:#65717c;margin-bottom:3px;">工區名稱</label><input type="text" class="input-zonename" value="${escapeHtml(zone.zoneName||`工區${zi+1}`)}" aria-label="工區名稱" style="width:100%;box-sizing:border-box;margin-bottom:6px;">`:`<div class="zone-name-display">${escapeHtml(zone.zoneName||`工區${zi+1}`)}</div>`}${readonly?'':`<button type="button" class="btn-add-item" onclick="addItemRow('${stage}',${zone.id})">＋ 新增預計辦理項目</button><button type="button" class="btn-delete-zone" onclick="deleteZone('${stage}',${zone.id})">－ 刪除此工區</button>`}</td>`:''}
                        <td class="item-name">${readonly?escapeHtml(item.itemName):`<input type="text" class="input-itemname" value="${escapeHtml(item.itemName)}"><div class="item-actions"><button type="button" class="btn-delete-item" onclick="deleteItemRow('${stage}',${zone.id},${ii})">刪除此項目</button></div>`}</td>
                        <td>${readonly?`<span class="permit-readonly-text">${escapeHtml(item.type)}</span>`:`<select class="sel-type" onchange="onTypeChange('${stage}',${zone.id},${ii},this)">${typeOpts}</select>`}</td>
                        <td>${readonly?`<span class="permit-readonly-text">${escapeHtml(item.detail)}</span>`:`<select class="sel-detail"></select>`}</td>
                        <td>${readonly?`<span class="permit-readonly-text">${escapeHtml(item.x)}</span>`:`<input type="text" class="input-x" value="${escapeHtml(item.x)}" placeholder="X坐標">`}</td>
                        <td>${readonly?`<span class="permit-readonly-text">${escapeHtml(item.y)}</span>`:`<input type="text" class="input-y" value="${escapeHtml(item.y)}" placeholder="Y坐標">`}</td>
                        <td><div class="land-service"><div class="land-service-header"><span class="land-service-title">地籍資料服務</span><span class="land-service-status">● 地籍資料</span></div>
                            <div class="land-container" data-stage="${stage}" data-id="${zone.id}" data-item-index="${ii}">${landGroupsHtml(stage,zone.id,ii,item,readonly)}</div>
                            ${readonly?`<div class="readonly-note">地段／地號／使用地類別／面積</div>`:`<button type="button" class="btn-add-land" onclick="addStageLandGroup('${stage}',${zone.id},${ii})">＋ 新增地段／地號</button><div class="land-query-result" id="landQueryResult-${stage}-${zone.id}-${ii}"></div><div style="margin-top:6px;"><button type="button" class="btn-query-land" onclick="queryStageCadastralByCoordinate('${stage}',${zone.id},${ii})">↗ 依坐標帶入地段／地號／使用地類別／面積</button></div><div class="land-service-note">可新增多筆地段／地號，每筆可指定使用地類別及面積。</div>`}
                        </div></td>
                        ${ii===0?`<td class="group-total-area-cell" rowspan="${rowSpan}"><span class="group-total-area" data-stage="${stage}" data-id="${zone.id}">${formatArea(total)}</span><span style="font-size:11px;color:#777;">㎡</span></td>`:''}
                    </tr>`;
                });
            });
            html+='</tbody></table>';wrap.innerHTML=html;
            if(!readonly){wrap.querySelectorAll('tr[data-id]').forEach(tr=>{const z=Number(tr.dataset.id),ii=Number(tr.dataset.itemIndex);const it=getItem(stage,z,ii);populateDetails(tr.querySelector('.sel-detail'),tr.querySelector('.sel-type')?.value||it?.type,it?.detail);});}
        }

        function onTypeChange(stage,id,itemIndex,sel){
            const item=getItem(stage,id,itemIndex);if(!item)return;
            item.type=sel.value;
            const tr=sel.closest('tr');const detail=tr?.querySelector('.sel-detail');
            populateDetails(detail,item.type,item.detail);
            item.detail=detail?.value||'';
        }

        function updateStageGroupTotalArea(el){
            const tr=el?.closest('tr[data-id]');if(!tr)return;
            const stage=tr.dataset.stage,id=Number(tr.dataset.id),itemIndex=Number(tr.dataset.itemIndex);
            const item=getItem(stage,id,itemIndex);if(!item)return;
            const total=[...tr.querySelectorAll('.area-input')].reduce((s,i)=>{const n=parseFloat(i.value);return s+(Number.isFinite(n)&&n>=0?n:0)},0);
            const out=document.querySelector(`.group-total-area[data-stage="${stage}"][data-id="${id}"]`); if(out)out.textContent=formatArea(calcZoneTotal(getZone(stage,id)) - (item.landGroups||[]).reduce((s,g)=>s+(parseFloat(g.area)||0),0) + total);
        }
        function refreshZoneTotal(stage,id){const out=document.querySelector(`.group-total-area[data-stage="${stage}"][data-id="${id}"]`);const z=getZone(stage,id);if(out&&z)out.textContent=formatArea(calcZoneTotal(z));}

        function addStageLandGroup(stage,id,itemIndex){
            const c=document.querySelector(`.land-container[data-stage="${stage}"][data-id="${id}"][data-item-index="${itemIndex}"]`);if(!c)return;
            const d=document.createElement('div');d.className='land-group';
            d.innerHTML=`<div class="land-field"><span class="land-field-label">地段</span><input type="text" class="section-input" placeholder="由坐標自動帶入"></div><div class="land-field"><span class="land-field-label">地號</span><input type="text" class="land-number-input" placeholder="例：123-4"></div><div class="land-field"><span class="land-field-label">使用地類別</span><select class="land-use-input"><option value="">請選擇</option>${landUseOptions.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select></div><div class="land-field"><span class="land-field-label">面積</span><input type="number" class="area-input" min="0" step="0.01" placeholder="㎡"></div><button type="button" class="btn-remove-land" onclick="removeStageLandGroup(this)">×</button>`;
            c.appendChild(d);syncItemFromDOM(stage,id,itemIndex);refreshZoneTotal(stage,id);
        }
        function removeStageLandGroup(btn){
            const g=btn.closest('.land-group'),c=g?.closest('.land-container');if(!g||!c)return;
            if(c.querySelectorAll('.land-group').length<=1){alert('至少保留一組地段、地號。');return;}
            const tr=c.closest('tr');const stage=tr.dataset.stage,id=Number(tr.dataset.id),ii=Number(tr.dataset.itemIndex);g.remove();syncItemFromDOM(stage,id,ii);refreshZoneTotal(stage,id);
        }

        async function queryStageCadastralByCoordinate(stage,id,itemIndex){
            const tr=document.querySelector(`#${stage}Wrap tr[data-id="${id}"][data-item-index="${itemIndex}"]`);const result=document.getElementById(`landQueryResult-${stage}-${id}-${itemIndex}`);if(!tr)return;
            const x=tr.querySelector('.input-x')?.value.trim()||'',y=tr.querySelector('.input-y')?.value.trim()||'';
            if(!x||!y){alert('請先輸入 X、Y 座標。');return;}
            const xn=Number(x.replace(/,/g,'')),yn=Number(y.replace(/,/g,''));if(!Number.isFinite(xn)||!Number.isFinite(yn)){alert('X、Y 座標必須為數字。');return;}
            try{
                const data=await demoCadastralLookup(xn,yn);if(!data?.success)throw new Error('查無對應地籍資料');
                const g=tr.querySelector('.land-container .land-group');if(!g)throw new Error('找不到地段／地號欄位');
                g.querySelector('.section-input').value=data.section||'';g.querySelector('.land-number-input').value=`${data.mainNumber||''}${data.subNumber?'-'+data.subNumber:''}`;const lu=g.querySelector('.land-use-input');if(lu)lu.value=data.landUse||'';const ar=g.querySelector('.area-input');if(ar)ar.value=data.area??'';
                syncItemFromDOM(stage,id,itemIndex);refreshZoneTotal(stage,id);
                if(result){result.innerHTML=`<strong>✓ 已依座標取得地籍資料</strong><br>座標：${escapeHtml(x)} ／ ${escapeHtml(y)}<br>地段：${escapeHtml(data.section||'')}　地號：${escapeHtml(data.mainNumber||'')}${data.subNumber?'－'+escapeHtml(data.subNumber):''}<br>使用地類別：${escapeHtml(data.landUse||'')}　面積：${escapeHtml(String(data.area??''))} ㎡ <span class="land-auto-badge">自動帶入</span>`;result.classList.add('active');}
            }catch(e){if(result){result.innerHTML=`<span style="color:#a94442;">⚠️ ${escapeHtml(e.message||'地籍資料查詢失敗')}</span>`;result.classList.add('active');}}
        }
        async function demoCadastralLookup(x,y){await new Promise(r=>setTimeout(r,300));return {success:true,section:'中福段',mainNumber:'123',subNumber:'4',landUse:'農牧用地',area:'120.5'};}

        function syncItemFromDOM(stage,id,itemIndex){
            if(isReadonly(stage))return;const item=getItem(stage,id,itemIndex);const tr=document.querySelector(`#${stage}Wrap tr[data-id="${id}"][data-item-index="${itemIndex}"]`);if(!item||!tr)return;
            item.itemName=tr.querySelector('.input-itemname')?.value.trim()??item.itemName;item.type=tr.querySelector('.sel-type')?.value||item.type;item.detail=tr.querySelector('.sel-detail')?.value||item.detail;item.x=tr.querySelector('.input-x')?.value.trim()??item.x;item.y=tr.querySelector('.input-y')?.value.trim()??item.y;
            item.landGroups=[...tr.querySelectorAll('.land-group')].map(g=>{const landNo=g.querySelector('.land-number-input')?.value.trim()||'';const match=landNo.match(/^\s*([^\-－]+?)(?:\s*[-－]\s*(.*))?\s*$/);return {section:g.querySelector('.section-input')?.value.trim()||'',mainNumber:match?(match[1]||'').trim():'',subNumber:match?(match[2]||'').trim():'',landUse:g.querySelector('.land-use-input')?.value||'',area:g.querySelector('.area-input')?.value.trim()||''};});
        }
        function collectDataFromDOM(stage){
            if(isReadonly(stage))return;const old=getStageData(stage);old.forEach(z=>{
                const firstRow=document.querySelector(`#${stage}Wrap tr[data-id="${z.id}"][data-item-index="0"]`);
                const zoneNameInput=firstRow?.querySelector('.input-zonename');
                if(zoneNameInput && z.isNewZone) z.zoneName=zoneNameInput.value.trim() || z.zoneName;
                z.items.forEach((_,ii)=>syncItemFromDOM(stage,z.id,ii));
            });
        }
        function addItemRow(stage,id){
            if(isReadonly(stage)){alert('會勘階段僅供檢視，無法新增預計辦理項目。');return;}
            collectDataFromDOM(stage);
            const zone=getZone(stage,id);
            if(!zone)return;
            if(!Array.isArray(zone.items))zone.items=[];
            const base=zone.items[0] || {x:'',y:'',landGroups:[{section:'',mainNumber:'',subNumber:'',landUse:'',area:''}]};
            zone.items.push({
                itemName:'',
                type:base.type || '安全設施',
                detail:base.detail || detailMap['安全設施'][0],
                x:base.x || '',
                y:base.y || '',
                landGroups:JSON.parse(JSON.stringify(base.landGroups&&base.landGroups.length?base.landGroups:[{section:'',mainNumber:'',subNumber:'',landUse:'',area:''}]))
            });
            renderTable(stage);
            updateStatusMsg(stage);
            const newIndex=zone.items.length-1;
            const input=document.querySelector(`#${stage}Wrap tr[data-id="${id}"][data-item-index="${newIndex}"] .input-itemname`);
            input?.focus();
        }
        function addRow(stage){
            if(isReadonly(stage)){alert('會勘階段僅供檢視，無法新增。');return;}
            collectDataFromDOM(stage);const id=getNextId(stage),n=getStageData(stage).length+1;const data=getStageData(stage);data.push({id,zoneName:`工區${n}`,isNewZone:true,items:[{itemName:'',type:'安全設施',detail:detailMap['安全設施'][0],x:'',y:'',landGroups:[{section:'',mainNumber:'',subNumber:'',landUse:'',area:''}]}]});renderTable(stage);updateStatusMsg(stage);
        }
        function deleteRow(stage,id){deleteZone(stage,id);}
        function deleteZone(stage,id){
            if(isReadonly(stage)){alert('會勘階段僅供檢視，無法刪除。');return;}
            collectDataFromDOM(stage);
            const data=getStageData(stage),zone=data.find(z=>z.id===id);if(!zone)return;
            if(!confirm(`【刪除工區確認】
確定要刪除「${zone.zoneName||'此工區'}」嗎？

按「確定」後，將一併刪除此工區及其所有預計辦理項目；按「取消」則不會刪除。

刪除結果需按下「儲存」才會正式保存。`))return;
            setStageData(stage,data.filter(z=>z.id!==id));renderTable(stage);updateStatusMsg(stage);
        }
        function deleteItemRow(stage,id,itemIndex){
            if(isReadonly(stage)){alert('會勘階段僅供檢視，無法刪除。');return;}
            collectDataFromDOM(stage);
            const zone=getZone(stage,id);if(!zone||!Array.isArray(zone.items))return;
            if(zone.items.length<=1){alert('每個工區至少需保留一個預計辦理項目；若要移除整個工區，請使用「刪除此工區」。');return;}
            const item=zone.items[itemIndex];
            if(!confirm(`【刪除項目確認】
確定要刪除預計辦理項目「${item?.itemName||'未命名項目'}」嗎？

按「確定」後才會刪除此項目；按「取消」則不會刪除。

刪除結果需按下「儲存」才會正式保存。`))return;
            zone.items.splice(itemIndex,1);renderTable(stage);updateStatusMsg(stage);
        }
        // 儲存規則：
        // 1. 核定儲存後，才把「已儲存版本」帶入變更階段。
        // 2. 變更儲存後，才把「已儲存版本」帶入結案階段。
        // 3. 未儲存的修改不會自動流到下一階段，避免誤把草稿當成正式資料。
        // 4. 結案儲存後即完成本階段資料保存。
        function saveStageData(stage){
            if(isReadonly(stage)){
                alert('會勘階段為唯讀資料，無需在此修改。');
                return;
            }

            collectDataFromDOM(stage);
            const savedData=cloneStageData(getStageData(stage));

            if(stage==='heding'){
                // 核定儲存 → 僅在「有變更」時帶入變更階段；若無變更，結案直接沿用核定。
                if(hasBiangeng){
                    dataBiangeng=cloneStageData(savedData);
                    stageInitialized.biangeng=true;
                }else{
                    dataBiangeng=[];
                }
                dataJiean=cloneStageData(savedData);
                stageInitialized.jiean=true;
            }else if(stage==='biangeng'){
                // 只有「有變更」時，變更儲存內容才會帶入結案。
                if(hasBiangeng){
                    dataJiean=cloneStageData(savedData);
                }else{
                    dataJiean=cloneStageData(dataHeding);
                }
                stageInitialized.jiean=true;
            }else if(stage==='jiean'){
                // 結案階段可獨立編輯；按下儲存後，正式保存目前結案資料，不再被前一階段覆蓋。
                dataJiean=cloneStageData(savedData);
                stageInitialized.jiean=true;
                renderTable('jiean');
            }

            updateStatusMsg(stage);
            if(stage==='heding') updateStatusMsg('biangeng');
            if(stage==='biangeng') updateStatusMsg('jiean');

            const nextStage=stage==='heding'?'biangeng':stage==='biangeng'?'jiean':'';
            if(nextStage){
                const nextName=stageLabel(nextStage);
                alert(`✅ ${stageLabel(stage)}階段資料已儲存！\n\n已將「已儲存資料」帶入${nextName}階段，您可進入${nextName}階段繼續修改。`);
            }else{
                alert(`✅ ${stageLabel(stage)}階段資料已儲存！`);
            }
        }
        function updateStatusMsg(stage){
            const e=document.getElementById(stage+'Status');
            if(e){
                const count=getStageData(stage).length;
                e.textContent=`共 ${count} 個工區｜資料已可供本階段編輯${stage==='heding'?'；儲存後同步至變更階段':stage==='biangeng'?'；儲存後同步至結案階段':''}`;
            }
        }
        function switchSubTab(stage){
            // 不自動收集目前階段的未儲存修改。
            if(stage==='heding') ensureStageDefault('heding');
            if(stage==='biangeng' && hasBiangeng) ensureStageDefault('biangeng');
            if(stage==='jiean') ensureStageDefault('jiean');
            document.querySelectorAll('.sub-tab-item').forEach(e=>e.classList.toggle('active',e.dataset.stage===stage));
            document.querySelectorAll('.sub-panel').forEach(e=>e.classList.toggle('active',e.id==='panel'+stage.charAt(0).toUpperCase()+stage.slice(1)));
            currentStage=stage;
            if(stage==='biangeng') updateBiangengVisibility();
            renderTable(stage);
            updateStatusMsg(stage);
        }

        document.addEventListener('DOMContentLoaded',()=>{
            document.querySelectorAll('.sub-tab-item').forEach(e=>e.addEventListener('click',()=>switchSubTab(e.dataset.stage)));
            document.getElementById('btnAddHeding')?.addEventListener('click',()=>addRow('heding'));
            document.getElementById('btnAddBiangeng')?.addEventListener('click',()=>addRow('biangeng'));
            document.getElementById('btnAddJiean')?.addEventListener('click',()=>addRow('jiean'));
            document.getElementById('btnSaveHeding')?.addEventListener('click',()=>saveStageData('heding'));
            document.getElementById('btnSaveBiangeng')?.addEventListener('click',()=>saveStageData('biangeng'));
            document.getElementById('hasBiangeng')?.addEventListener('change',function(){ hasBiangeng=this.checked; updateBiangengVisibility(); if(currentStage==='biangeng') renderTable('biangeng'); });
            document.getElementById('btnSaveJiean')?.addEventListener('click',()=>saveStageData('jiean'));
            renderTable('kankan');renderTable('heding');renderTable('biangeng');renderTable('jiean');updateBiangengVisibility();switchSubTab('kankan');
        });
        document.querySelectorAll('#mainTabs .tab-item').forEach(el=>el.addEventListener('click',function(){document.querySelectorAll('#mainTabs .tab-item').forEach(t=>t.classList.remove('active'));this.classList.add('active');const main=document.getElementById('permitMain');if(main)main.style.display=this.id==='tabPermit'?'block':'none';}));
        const permitMain=document.getElementById('permitMain');if(permitMain)permitMain.style.display='block';

        window.hasBiangeng=hasBiangeng;window.updateBiangengVisibility=updateBiangengVisibility;window.deleteRow=deleteRow;window.deleteZone=deleteZone;window.deleteItemRow=deleteItemRow;window.addRow=addRow;window.addItemRow=addItemRow;window.saveStageData=saveStageData;window.dataBiangeng=dataBiangeng;window.switchSubTab=switchSubTab;window.renderTable=renderTable;window.collectDataFromDOM=collectDataFromDOM;window.getStageData=getStageData;window.setStageData=setStageData;window.isReadonly=isReadonly;window.populateDetails=populateDetails;window.addStageLandGroup=addStageLandGroup;window.removeStageLandGroup=removeStageLandGroup;window.updateStageGroupTotalArea=updateStageGroupTotalArea;window.queryStageCadastralByCoordinate=queryStageCadastralByCoordinate;window.escapeHtml=escapeHtml;window.detailMap=detailMap;window.landUseOptions=landUseOptions;

    </script>
</body>
