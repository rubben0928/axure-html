        <body>

        <div class="doc-container">
            <h1>工程更正申請作業 — 系統功能優化說明</h1>
            <div class="subtitle">生態檢核資料同步 · 工程基本資料即時更正 · 發文字號管理 · 欄位自動帶入</div>

            <!-- 一、生態檢核系統資料同步 -->
            <div class="section">
                <h2>一、生態檢核系統資料同步</h2>
                <p>於「工程更正申請作業」表單中完成以下自動化介接機制：</p>
                <div class="feature-list">
                    <ul>
                        <li><strong>觸發條件：</strong>使用者填寫「發文字號」並點擊「<strong>儲存資料</strong>」按鈕後，系統自動啟動資料拋送程序。</li>
                        <li><strong>拋送內容：</strong>將更新後的「<strong>生態分級階段</strong>」（如：規劃設計、施工、維護管理等）、「<strong>生態分級</strong>」（如：1級、2級等）及「<strong>異動原因</strong>」（即變更原因區塊內新增的「生態分級異動原因說明」欄位內容）一併介接至生態檢核系統。</li>
                        <li><strong>介接方式：</strong>透過 API 或資料庫直接同步，確保兩系統生態分級資訊即時一致，減少人工重複輸入。</li>
                    </ul>
                </div>
                <div class="note">
                    <strong>💡 注意：</strong>若發文字號為空或未填寫就按儲存資料時，系統將不予拋送，並提示使用者發文字號尚未儲存訊息。
                </div>
            </div>

            <!-- 二、工程基本資料即時更正 -->
            <div class="section">
                <h2>二、工程基本資料即時更正</h2>
                <p>於發文字號儲存成功後，系統將自動執行以下更新：</p>
                <div class="flow-step">
                    <div class="num">1</div>
                    <div class="desc"><strong>同步更新「工程基本資料」</strong> — 將更正後的最新「生態分級」寫入該工程之基本資料主檔，覆蓋舊有記錄。</div>
                </div>
            </div>

            <!-- 三、工程勘查階段生態分級異動規則 -->
            <div class="section">
                <h2>三、工程勘查階段生態分級異動規則</h2>
                <p>當核定後，若有工程申請異動生態分級時，勘查紀錄表的生態分級不要同步異動，且勘查紀錄表這時候若有異動生態分級，也不會同步到生態檢核系統。</p>
                <div class="important-warning">
                    ⚠️ <strong>這點很重要！</strong> 核定後案件，若勘查表異動生態分級，不會連動到生態檢核系統。
                </div>
            </div>

            <!-- 四、發文字號顯示時機 -->
            <div class="section">
                <h2>四、發文字號顯示時機</h2>
                <p>「發文字號」欄位之顯示與使用情境如下：</p>
                <div class="feature-list">
                    <ul>
                        <li><strong>顯示位置：</strong>僅於「<strong>本署核定作業</strong>」之編輯畫面中呈現，供署駐點填寫核定公文之發文字號。</li>
                        <li><strong>必填性：</strong>於核定作業畫面中，發文字號為必填欄位，以利後續資料拋送與追蹤。</li>
                    </ul>
                </div>
            </div>

            <!-- 五、變更原因與備註欄位優化 -->
            <div class="section">
                <h2>五、變更原因與備註欄位優化</h2>
                <p>為提升異動原因之完整性與操作便利性，進行以下調整：</p>
                <div class="two-col">
                    <div>
                        <span class="badge">新增欄位</span>
                        <h3>生態分級異動原因說明</h3>
                        <p>於「變更原因」區塊內新增獨立輸入框，供使用者詳細記錄生態分級變動之具體理由，例如：「因現地生態調查發現保育類物種，故由2級調整為1級」。</p>
                    </div>
                    <div>
                        <span class="badge">自動帶入</span>
                        <h3>備註欄位一鍵帶入</h3>
                        <p>使用者點選「備註」欄位時，系統會自動將「<strong>變更原因</strong>」與「<strong>生態分級異動原因說明</strong>」合併帶入（以換行分隔），大幅減少重複繕打時間，同時確保備註內容完整涵蓋異動資訊。</p>
                    </div>
                </div>
            </div>

            <!-- 六、整體作業流程概述 -->
            <div class="section">
                <h2>六、整體作業流程概述</h2>
                <p>以下為「工程更正申請作業」搭配上述優化功能之完整操作流程：</p>
                <ol style="margin: 10px 0 10px 22px; line-height: 1.9;">
                    <li>使用者進入「工程更正申請作業」頁面，填寫各項更正資訊（含碳排量上限、生態等級、變更原因等）。</li>
                    <li>於「變更原因」區塊中，若涉及生態分級異動，請於「生態分級異動原因說明」欄位輸入詳細理由。</li>
                    <li>點選「備註」欄位，系統自動將變更原因與生態異動原因合併帶入，使用者可視需要微調。</li>
                    <li>填寫「發文字號」（僅於核定作業畫面顯示），確認所有資料無誤後，點擊「儲存資料」。</li>
                    <li>儲存時，系統將：
                        <ul>
                            <li>即時更新管考系統內部「工程基本資料」之生態分級。</li>
                            <li>同時將「生態分級階段」、「生態分級」及「異動原因」拋送至生態檢核系統，達成雙向同步。</li>
                        </ul>
                    </li>
                    <li>核定後案件，若勘查表異動生態分級，不會連動到生態檢核系統。</li>
                </ol>
            </div>

            <div class="footer-note"></div>
        </div>

        </body>
        </html>`;

        // ================================================================
        // 3. 將 HTML 內容寫入對應的 iframe
        // ================================================================
        function loadIframe(id, html) {
            const iframe = document.getElementById(id);
            if (!iframe) return;
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(html);
                doc.close();
            } catch (e) {
                // fallback: 使用 srcdoc
                iframe.srcdoc = html;
            }
        }

        // 等待 DOM 載入完成後寫入
        if (document.readyState === 'complete') {
            loadIframe('leftFrame', leftHTML);
            loadIframe('rightFrame', rightHTML);
        } else {
            window.addEventListener('load', function() {
                loadIframe('leftFrame', leftHTML);
                loadIframe('rightFrame', rightHTML);
            });
        }
    </script>

</body>
</html>
